<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F14" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>انباردار</title>
    <script>
      // اعمال تم پیش از اولین رندر تا هنگام باز شدن برنامه چشمک نزند.
      // مرجع اصلی تم دیتابیس است؛ این فقط یک کش است (کلیدها در services/legacySettingsMigration.ts).
      (function () {
        try {
          var pref = localStorage.getItem('anbardar.theme.v1');
          if (!pref) {
            var legacy = localStorage.getItem('anbardar.settings.v1'); // نسخه Phase 1
            pref = legacy ? JSON.parse(legacy).theme : 'dark';
          }
          var dark = pref !== 'light' && (pref !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
